name: Build Windows Executable

on:
  push:
    tags:
      - 'v*'          # runs automatically on any tag like v1.0.0
  workflow_dispatch:   # also lets you trigger a build manually from the GitHub UI

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # required to upload files to a GitHub Release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements_win.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_win.txt
          pip install pyinstaller pyinstaller-hooks-contrib

      - name: Build executable
        run: pyinstaller GabaMic.spec --noconfirm

      - name: Zip the output folder
        shell: pwsh
        run: Compress-Archive -Path dist\GabaMic -DestinationPath GabaMic-Windows.zip

      # Always upload as a downloadable workflow artifact (useful for test builds)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GabaMic-Windows
          path: GabaMic-Windows.zip
          retention-days: 30

      # On a tagged release, also attach the zip to the GitHub Release page
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: GabaMic-Windows.zip
          generate_release_notes: true
